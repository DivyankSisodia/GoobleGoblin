name: gooble_goblin
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  fl_chart: ^1.1.1
  flutter:
    sdk: flutter
  flutter_3d_controller: ^2.3.0
  flutter_local_notifications: ^19.5.0
  flutter_timezone: ^5.0.1
  google_fonts: ^6.3.3
  local_auth: ^3.0.0
  logger: ^2.6.2
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  syncfusion_flutter_chat: ^32.1.21
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/3d_model/
    - assets/app_icon/

flutter_native_splash:
  color: "#000000"  # Dark background to match animation
  image: assets/app_icon/app_icon_dark_mode.png  # Your logo/image (centered static)
  android: true
  ios: true
